services:

  frontend:
    build:
      context: ./frontend
    image: vsc-frontend:dev
    container_name: vsc-frontend
    ports:
      - "8080:80"
    depends_on:
      - customer-booking
      - job-maintenance

  customer-booking:
    build:
      context: ./services/CustomerBookingService
    image: vsc-customer-booking:dev
    container_name: vsc-customer-booking
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal;Port=3306;Database=customer_booking_db;User=vsc_app;Password=${MYSQL_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "VehicleServiceCenter"
      Jwt__Audience: "VehicleServiceCenterClients"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      - kafka

  job-maintenance:
    build:
      context: ./services/JobMaintenanceService
    image: vsc-job-maintenance:dev
    container_name: vsc-job-maintenance
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal;Port=3306;Database=job_maintenance_db;User=vsc_app;Password=${MYSQL_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "VehicleServiceCenter"
      Jwt__Audience: "VehicleServiceCenterClients"
      Kafka__BootstrapServers: "kafka:29092"
    depends_on:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:8.3.0
    container_name: vsc-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk